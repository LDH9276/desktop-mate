<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' mate-model: data: blob:; connect-src 'self' mate-model: blob: ws://127.0.0.1:5173; font-src 'self' data:; worker-src 'self' blob:;" />
    <title>Mate — 나의 데스크톱 친구</title>

      <main style="box-sizing:border-box;max-width:680px;margin:64px auto;padding:32px;font:16px/1.65 system-ui,sans-serif;color:#26222d;background:#fff;border:1px solid #ddd6e5;border-radius:18px;box-shadow:0 12px 36px #241a331a">
        <h1 style="margin:0 0 12px;font-size:26px">Mate는 브라우저에서 직접 실행하지 않습니다</h1>
        <p style="margin:0 0 10px"><code>index.html</code>은 앱의 소스 파일입니다. 이 페이지를 <code>file:///</code> 주소로 열면 실행되지 않습니다.</p>
        <p style="margin:0">이 폴더로 돌아가 <strong>Mate 실행.vbs</strong>를 두 번 누르세요. 이미 실행 중이라면 화면 오른쪽 아래 알림 영역의 Mate 아이콘을 눌러 다시 표시할 수 있습니다.</p>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
