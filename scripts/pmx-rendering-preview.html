<!doctype html><html><head><style>body{margin:0;background:#354656}canvas{display:block}</style></head><body><script type="module">
import * as THREE from 'three';
import { MMDLoader } from 'three/addons/loaders/MMDLoader.js';
import { OutlineEffect as LegacyOutline } from 'three/addons/effects/OutlineEffect.js';
import { OutlineEffect } from '../src/vendor/PmxOutlineEffect.js';
import { configurePmxMaterials } from '../src/pmx-materials.mjs';
import { createMmdPhysics } from '../src/mmd-physics.mjs';
const query=new URLSearchParams(location.search), fixed=query.get('fixed')!=='false';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,preserveDrawingBuffer:true});
renderer.setSize(900,900); renderer.setClearColor(0,0); document.body.append(renderer.domElement);
const effect=new (fixed?OutlineEffect:LegacyOutline)(renderer);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(29,1,.1,100);
const ambient=new THREE.HemisphereLight(0xffffff,0xc3b4a3,2);scene.add(ambient);
const key=new THREE.DirectionalLight(0xfff5e9,2.4);key.position.set(-2,4,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xf0eeff,1.3);fill.position.set(3,2,-3);scene.add(fill);
let mesh;
window.runHairStudy=async (legacy=false,weight=.35)=>{
  if(!globalThis.Ammo?.btVector3){
    await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='/physics/ammo.wasm.js';script.onload=resolve;script.onerror=reject;document.head.append(script);});
    globalThis.Ammo=await globalThis.Ammo({wasmBinary:await (await fetch('/physics/ammo.wasm.wasm')).arrayBuffer()});
  }
  const factory=legacy?(await import('/scripts/fixtures/pmx-physics-before-fix.mjs')).createMmdPhysics:createMmdPhysics;
  const simulation=factory(mesh),bones=mesh.skeleton.bones;
  const head=bones.find(b=>/^(頭|head)$/i.test(b.name)),torso=bones.find(b=>/^(上半身|upper body|spine)$/i.test(b.name));
  const reference=bones.map(b=>({q:b.quaternion.clone(),p:b.position.clone()}));
  const headHair=new Set(bones.filter(b=>{
    if(!/hair/i.test(b.name))return false;
    for(let parent=b.parent;parent?.isBone;parent=parent.parent)if(parent===head)return true;
    return false;
  }));
  let maxHairAngle=0,finite=true;
  for(let frame=0;frame<240;frame++){
    simulation.restore();
    if(head)head.rotation.y=Math.sin(frame/40)*.22;
    if(torso)torso.rotation.z=Math.sin(frame/55)*.1;
    simulation.update(1/60,true,.35,weight);
    for(const [i,b] of bones.entries()){
      finite &&= [...b.position.toArray(),...b.quaternion.toArray()].every(Number.isFinite);
      if(headHair.has(b))maxHairAngle=Math.max(maxHairAngle,reference[i].q.clone().normalize().angleTo(b.quaternion.clone().normalize()));
    }
  }
  mesh.rotation.y=.18;effect.render(scene,camera);
  const result={legacy,weight,bodies:simulation.bodyCount,steps:simulation.steps,head:head?.name,headHairCount:headHair.size,maxHairAngle,finite};
  // Keep the rendered frame for the screenshot, then release the simulation.
  simulation.dispose();
  return result;
};
window.checkOutlineAlpha=()=>{
  const target=new THREE.WebGLRenderTarget(32,32), s=new THREE.Scene();
  const c=new THREE.OrthographicCamera(-1,1,1,-1,.1,10);c.position.z=3;
  const map=new THREE.DataTexture(new Uint8Array([255,255,255,0,255,255,255,128]),2,1);map.needsUpdate=true;
  const m=new THREE.MeshBasicMaterial({map,side:THREE.DoubleSide,transparent:true,alphaTest:1/255});
  m.userData.outlineParameters={color:[1,0,0],alpha:1,thickness:.001};
  const plane=new THREE.Mesh(new THREE.PlaneGeometry(2,2),m);plane.rotation.y=Math.PI;s.add(plane);
  s.updateMatrixWorld(true);c.updateMatrixWorld(true);
  renderer.setRenderTarget(target);renderer.clear();effect.renderOutline(s,c);
  const empty=new Uint8Array(4),partial=new Uint8Array(4);
  renderer.readRenderTargetPixels(target,24,16,1,1,empty);
  renderer.readRenderTargetPixels(target,8,16,1,1,partial);
  renderer.setRenderTarget(null);target.dispose();map.dispose();m.dispose();plane.geometry.dispose();
  return {empty:[...empty],partial:[...partial]};
};
const manager=new THREE.LoadingManager();
manager.onError=url=>document.body.dataset.error=url;
manager.onLoad=()=>{
  if(!mesh)return;
  window.materialReport=mesh.material.map(m=>({name:m.name,overlayOf:m.userData.pmxOverlayOf,outline:m.userData.outlineParameters,
    transparent:m.transparent,depthWrite:m.depthWrite,alphaTest:m.alphaTest,polygonOffset:m.polygonOffset}));
  window.draw=(angle=0,toon=true,shadows=false)=>{
    mesh.rotation.y=angle;mesh.castShadow=shadows;mesh.receiveShadow=shadows;
    renderer.shadowMap.enabled=shadows;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    key.castShadow=shadows;key.target.position.set(0,1,0);scene.add(key.target);
    key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-1.3;key.shadow.camera.right=1.3;
    key.shadow.camera.top=1.3;key.shadow.camera.bottom=-1.3;key.shadow.camera.near=.1;key.shadow.camera.far=12;
    key.shadow.bias=-.0001;key.shadow.normalBias=.008;
    ambient.intensity=shadows?.8:2;fill.intensity=shadows?.4:1.3;
    toon?effect.render(scene,camera):renderer.render(scene,camera);
  };
  window.draw();document.body.dataset.ready='true';
};
new MMDLoader(manager).load(query.get('model'),loaded=>{
  mesh=loaded;
  configurePmxMaterials(fixed?mesh:{material:mesh.material});
  const box=new THREE.Box3().setFromObject(mesh),scale=2/(box.max.y-box.min.y);
  mesh.scale.setScalar(scale);mesh.position.set(-(box.min.x+box.max.x)*.5*scale,-box.min.y*scale,-(box.min.z+box.max.z)*.5*scale);
  for(const material of mesh.material) material.userData.outlineParameters.color=new THREE.Color('#343941').toArray();
  scene.add(mesh);camera.position.set(0,1.62,2.6);camera.lookAt(0,1.62,0);camera.zoom=1.45;camera.updateProjectionMatrix();
},undefined,error=>document.body.dataset.error=String(error));
</script></body></html>
